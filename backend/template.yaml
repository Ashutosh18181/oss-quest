AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OSS Quest Backend

Resources:
  GitHubApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      Environment:
        Variables:
          GITHUB_PAT: !Ref GitHubToken
      Events:
        GetIssues:
          Type: Api
          Properties:
            Path: /api/issues
            Method: get

Parameters:
  GitHubToken:
    Type: String
    Description: GitHub Personal Access Token (Read-only)
    NoEcho: true

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/issues"
